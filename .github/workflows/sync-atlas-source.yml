name: Synchronize Atlas source archive



on:

  workflow_dispatch:
  
  push:
  
    branches: [main]
    
    paths: [atlas-source-sync.zip]
    


permissions:

  contents: write
  


jobs:

  synchronize:
  
    if: "!startsWith(github.event.head_commit.message, 'Sync Atlas source tree')"
    
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Check out repository
      
        uses: actions/checkout@v4
        


      - name: Expand approved source archive
      
        run: |
        
          unzip -o atlas-source-sync.zip -d .
          
          rm -f atlas-source-sync.zip
          
          rm -f .github/workflows/control-plane.yml
          
          git config user.name "atlas-sync-bot"
          
          git config user.email "atlas-sync-bot@users.noreply.github.com"
          
          git add -A
          
          git diff --cached --quiet || git commit -m "Sync Atlas source tree"
          
          git push
          





















